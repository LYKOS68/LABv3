<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <!-- Hintergrund-Verlauf mit hellgrünem / olivem Stich -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d3b1f" />
      <stop offset="50%" stop-color="#2a2816" />
      <stop offset="100%" stop-color="#18170d" />
    </linearGradient>

    <!-- Subtiles Glühen für das Icon -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dunkler Hintergrund mit leicht abgerundeten Ecken -->
  <rect width="800" height="450" rx="20" fill="url(#bgGradient)" />

  <!-- Äußerer Rahmen (subtil hellgrün/golden) -->
  <rect x="2" y="2" width="796" height="446" rx="18" fill="none" stroke="#686236" stroke-width="2" opacity="0.4" />

  <!-- Plakette oben links: "BEISPIELANZEIGE" -->
  <g transform="translate(35, 30)">
    <rect width="160" height="34" rx="6" fill="#1f1d10" stroke="#484423" stroke-width="1.5" />
    <text x="80" y="22" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="12" fill="#d4ce9b" text-anchor="middle" letter-spacing="1">
      BEISPIELANZEIGE
    </text>
  </g>

  <!-- Mikrofon-Icon in der Mitte -->
  <g transform="translate(400, 190) scale(1.4)" filter="url(#subtleGlow)">
    <!-- Mikrofonkopf -->
    <circle cx="0" cy="-25" r="18" fill="none" stroke="#d4ce9b" stroke-width="3.5" />
    <!-- Mikrofongriff -->
    <path d="M-10 -10 L-25 15 C-27 18 -25 22 -21 22 C-19 22 -17 21 -15 18 L-2 -3" fill="none" stroke="#d4ce9b" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Kabel -->
    <path d="M-22 21 C-25 28 -15 32 -5 30 C5 28 15 34 10 40" fill="none" stroke="#d4ce9b" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Text-Zeile darunter -->
  <text x="400" y="325" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="22" fill="#e6e1be" text-anchor="middle" letter-spacing="0.5">
    Galerie - Bildmaterial folgt
  </text>
</svg>